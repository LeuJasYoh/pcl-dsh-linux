name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend build and tests
        run: mvn -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pcl-dsh-web/package-lock.json
      - name: Frontend install
        working-directory: pcl-dsh-web
        run: npm ci
      - name: Frontend build
        working-directory: pcl-dsh-web
        run: npm run build
