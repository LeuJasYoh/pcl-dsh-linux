# PCL-DSH-Linux 运行配置。
# 数据目录优先级：PCL_DSH_DATA 环境变量 > -Dpcl.data 系统属性 > ./data。
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: ${pcl.session-timeout:12h}
      cookie:
        http-only: true
        same-site: lax
        secure: false
spring:
  application:
    name: pcl-dsh-linux
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
logging:
  level:
    root: INFO
pcl:
  data-root: ${PCL_DSH_DATA:${pcl.data:./data}}
  version: 0.3.0
  session-timeout: 12h
  sse-heartbeat: 15s
  sse-timeout: 30m
  login-window: 60s
  login-lock: 60s
  login-max-failures: 5
  job-timeout: 20m
  # 发布包只读 tools 目录；留空时自动从 jar 所在目录推断（current/tools）。
  tool-root: ""
  # /workbench 工作台反向代理：关闭时 /api/instances/{id}/web-url 返回回环绝对地址（本机开发用）。
  proxy-enabled: true
  proxy-timeout: 60s
  proxy-connect-timeout: 5s
