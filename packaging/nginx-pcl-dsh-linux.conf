# PCL-DSH-Linux Nginx 站点配置（Ubuntu 24.04）
# 安装位置：/etc/nginx/conf.d/pcl-dsh-linux.conf
# 前提：发布包静态资源位于 /opt/pcl-dsh-linux/current/static，
#       Spring Boot 仅监听 127.0.0.1:8080。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

limit_req_zone $binary_remote_addr zone=pcl_login:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;

    # 可选：在云安全组之外再加一层来源 IP 白名单（安装脚本按需启用）
    # allow 203.0.113.10;
    # deny all;

    root /opt/pcl-dsh-linux/current/static;
    index index.html;

    client_max_body_size 2048m;
    server_tokens off;

    # API：SSE / 长任务不缓冲，超时放宽
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /api/auth/login {
        limit_req zone=pcl_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # DSH 工作台反向代理：支持 WebSocket，禁用缓冲，不记录访问日志（防止 token 泄漏）
    location /workbench/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    # SPA：前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
